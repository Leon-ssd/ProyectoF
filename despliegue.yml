services:
  postgres_db_prod:
    image: postgres:16-alpine
    container_name: postgres_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stream_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secreto123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stream_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - stream-network

  stream_api_prod:
    image: emanuelxd/stream-api:latest
    container_name: stream_api_prod
    restart: unless-stopped
    environment:
      - DB_CONNECTION_STRING=Host=postgres_db_prod;Port=5432;Database=${DB_NAME:-stream_db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-secreto123}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres_db_prod:
        condition: service_healthy
    networks:
      - stream-network

volumes:
  pgdata:

networks:
  stream-network:
    driver: bridge
